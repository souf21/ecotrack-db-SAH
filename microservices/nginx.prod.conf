server {
    listen 80;
    server_name ecotrack.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ecotrack.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ecotrack.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecotrack.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://api-gateway:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
