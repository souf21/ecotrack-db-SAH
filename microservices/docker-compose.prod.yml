version: '3.8'

services:

  # api-gateway moves to internal port 3001 — nginx takes port 80 publicly
  api-gateway:
    ports: []
    environment:
      PORT: 3001

  # Remove all direct host access to internal services
  service-auth:
    ports: []

  service-containers:
    ports: []

  service-routes:
    ports: []

  service-iot:
    ports: []

  service-gamification:
    ports: []

  service-analytics:
    ports: []

  redis:
    ports: []

  # IoT Simulator — runs 24/7, restarts automatically on crash
  simulator:
    build:
      context: ./service-iot
      dockerfile: Dockerfile.simulator
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      IOT_API_KEY: ${IOT_API_KEY}
      IOT_GATEWAY_URL: http://api-gateway:3001/api/iot/readings
    depends_on:
      - api-gateway
    restart: unless-stopped

  # Nginx — the only door to the outside world
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
