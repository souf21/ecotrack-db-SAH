version: '3.8'

services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      SERVICE_AUTH_URL: http://service-auth:5001
      SERVICE_CONTAINERS_URL: http://service-containers:5002
      SERVICE_ROUTES_URL: http://service-routes:5003
      SERVICE_IOT_URL: http://service-iot:5004
      SERVICE_GAMIFICATION_URL: http://service-gamification:5005
      SERVICE_ANALYTICS_URL: http://service-analytics:5006
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    depends_on:
      - service-auth
      - service-containers
      - service-routes
      - service-iot
      - service-gamification
      - service-analytics
    restart: unless-stopped

  service-auth:
    build: ./service-auth
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    restart: unless-stopped

  service-containers:
    build: ./service-containers
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    restart: unless-stopped

  service-routes:
    build: ./service-routes
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SERVICE_IOT_URL: http://service-iot:5004
      IOT_API_KEY: ${IOT_API_KEY}
    depends_on:
      - service-iot
    restart: unless-stopped

  service-iot:
    build: ./service-iot
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      IOT_API_KEY: ${IOT_API_KEY}
      FILL_ALERT_THRESHOLD: 80
    restart: unless-stopped

  service-gamification:
    build: ./service-gamification
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POINTS_SIGNALEMENT_SOUMIS: 10
      POINTS_SIGNALEMENT_TRAITE: 20
    restart: unless-stopped

  service-analytics:
    build: ./service-analytics
    ports:
      - "5006:5006"
    environment:
      PORT: 5006
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      FILL_ALERT_THRESHOLD: 80
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped